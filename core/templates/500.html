<!DOCTYPE html>
<html lang="en-gb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something Went Wrong | UG Hydrogen Fuel Racing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0d0d0d; color: #f5f5f5;
            font-family: 'IBM Plex Serif', serif; text-align: center; padding: 24px;
        }
        .code {
            font-size: clamp(90px, 18vw, 180px); font-weight: 700; line-height: 1;
            color: #ffd000; letter-spacing: 4px;
        }
        h1 { font-size: clamp(22px, 4vw, 34px); font-weight: 300; margin: 18px 0 12px; }
        p { font-size: 16px; font-weight: 300; color: #9a9a9a; line-height: 1.7; max-width: 440px; margin: 0 auto 34px; }
        a.home {
            display: inline-block; padding: 15px 34px; border: 1px solid #ffd000;
            color: #ffd000; text-decoration: none; font-style: italic;
            letter-spacing: 2px; text-transform: uppercase; font-size: 14px;
            transition: background 0.25s, color 0.25s;
        }
        a.home:hover { background: #ffd000; color: #111; }
    </style>
</head>
<body>
    <main>
        <div class="code">500</div>
        <h1>We hit a mechanical problem.</h1>
        <p>Something went wrong on our side. The pit crew has been notified; please try again in a moment.</p>
        <a class="home" href="/">Back to Home</a>
    </main>
</body>
</html>
